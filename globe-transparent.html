<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globe – Transparent</title>
  <style>
    body {
      margin: 0;
      background: transparent;
    }

    .globe-wrap {
      position: relative;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
    }

    #globe {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    @media (max-width: 767px) {
      .globe-wrap { max-width: 320px; }
    }
    @media (max-width: 479px) {
      .globe-wrap { max-width: 260px; }
    }
  </style>
</head>
<body>

<div class="globe-wrap">
  <canvas id="globe"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/cobe@0.6.1/dist/cobe.umd.min.js"></script>
<script>
  const canvas = document.getElementById('globe');

  const markers = [
    { location: [37.7595, -122.4367], size: 0.03 },
    { location: [40.7128, -74.006],   size: 0.04 },
    { location: [51.5074, -0.1278],   size: 0.04 },
    { location: [48.8566,  2.3522],   size: 0.03 },
    { location: [52.52,   13.405],    size: 0.03 },
    { location: [35.6762, 139.6503],  size: 0.04 },
    { location: [22.3193, 114.1694],  size: 0.03 },
    { location: [-33.8688, 151.2093], size: 0.03 },
    { location: [55.7558,  37.6173],  size: 0.03 },
    { location: [28.6139,  77.209],   size: 0.03 },
    { location: [-23.5505, -46.6333], size: 0.03 },
    { location: [1.3521,  103.8198],  size: 0.03 },
    { location: [19.4326,  -99.1332], size: 0.03 },
    { location: [41.9028,  12.4964],  size: 0.03 },
    { location: [31.2304, 121.4737],  size: 0.03 },
  ];

  let phi = 0;
  let width = 0;
  let globe;

  function resize() {
    width = canvas.offsetWidth;
    canvas.width  = width * devicePixelRatio;
    canvas.height = width * devicePixelRatio;
  }

  resize();
  window.addEventListener('resize', () => {
    resize();
  });

  globe = createGlobe(canvas, {
    devicePixelRatio: devicePixelRatio,
    width:  width * devicePixelRatio,
    height: width * devicePixelRatio,
    phi: 0,
    theta: 0.3,
    dark: 0,
    diffuse: 1.2,
    mapSamples: 16000,
    mapBrightness: 6,
    baseColor:   [0.85, 0.9, 1.0],
    markerColor: [0.1,  0.4, 1.0],
    glowColor:   [0.7,  0.85, 1.0],
    markers: markers,
    onRender(state) {
      state.phi    = phi;
      state.width  = width * devicePixelRatio;
      state.height = width * devicePixelRatio;
      phi += 0.004;
    }
  });
</script>

</body>
</html>
